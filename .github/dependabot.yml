version: 2

# Routine version updates share one low-noise maintenance PR. Dependabot
# security updates remain controlled separately by the repository security
# settings and are not delayed by this schedule.
multi-ecosystem-groups:
  monthly-maintenance:
    schedule:
      interval: monthly
      time: "06:17"
      timezone: Europe/Berlin

updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: monthly-maintenance
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: monthly-maintenance
    open-pull-requests-limit: 3
