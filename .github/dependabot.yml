version: 2

# Routine version updates share one low-noise maintenance PR. Dependabot
# security updates remain controlled separately by the repository security
# settings and are not delayed by this schedule.
multi-ecosystem-groups:
  monthly-maintenance:
    schedule:
      interval: monthly
      time: "06:17"
      timezone: Europe/Berlin

updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: monthly-maintenance
    open-pull-requests-limit: 5
    # Incident 2026-08-03: separate @x402/evm and @x402/fetch PRs split one
    # runtime release and tripped the exact-version safety gate. Owner: Codex
    # Scry lane. Review by 2026-08-31; remove if Dependabot groups these pins
    # reliably without an explicit rule.
    groups:
      x402-runtime:
        applies-to: version-updates
        patterns:
          - "@x402/*"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: monthly-maintenance
    open-pull-requests-limit: 3
