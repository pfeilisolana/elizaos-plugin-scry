version: 2

# Keep each package manager on the same low-noise monthly schedule. The npm
# entry stays a normal single-ecosystem update so its x402 runtime group is
# honored; Dependabot ignores nested `groups` for multi-ecosystem updates.
# Security updates remain controlled separately by the repository settings.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:17"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Incidents 2026-08-03 and 2026-08-24: separate @x402/evm and @x402/fetch PRs split one
    # runtime release and tripped the exact-version safety gate. Owner: Codex
    # Scry lane. Keep this group while both packages share one runtime pin.
    groups:
      x402-runtime:
        applies-to: version-updates
        patterns:
          - "@x402/*"
      # Incident 2026-08-28: Vitest and its coverage provider declare exact peer
      # versions, so separate updates cannot be installed. Keep them atomic.
      vitest-suite:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:17"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
