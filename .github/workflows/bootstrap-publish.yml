name: bootstrap npm publish

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type @scrysolanahub/plugin-scry@0.1.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: bootstrap-npm-publish-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - name: Verify immutable bootstrap request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v0.1.0"
          test "$CONFIRMATION" = "@scrysolanahub/plugin-scry@0.1.0"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm trusted-publishing-compatible runtime
        run: npm install --global npm@11.5.1

      - name: Verify npm runtime
        run: test "$(npm --version)" = "11.5.1"

      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev

      - name: Publish one-time bootstrap with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          SCRY_PUBLISH_AUTHORITY: ${{ secrets.SCRY_PUBLISH_AUTHORITY }}
